name: Build RefinePilot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  REFINEPILOT_LICENSE_API_URL: ${{ vars.REFINEPILOT_LICENSE_API_URL }}
  SIGNING_STORE_B64: ${{ secrets.REFINEPILOT_KEYSTORE_B64 }}
  SIGNING_STORE_PASSWORD: ${{ secrets.REFINEPILOT_KEYSTORE_PASSWORD }}
  SIGNING_KEY_ALIAS: ${{ secrets.REFINEPILOT_KEY_ALIAS }}
  SIGNING_KEY_PASSWORD: ${{ secrets.REFINEPILOT_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Android source
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build development APK
        run: gradle --no-daemon assembleDebug

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: RefinePilot-v0.3-development-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build unsigned production release
        if: env.SIGNING_STORE_B64 != '' && env.SIGNING_STORE_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_PASSWORD != ''
        run: gradle --no-daemon assembleRelease

      - name: Restore production signing keystore
        if: env.SIGNING_STORE_B64 != '' && env.SIGNING_STORE_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_PASSWORD != ''
        run: echo "$SIGNING_STORE_B64" | base64 --decode > refinepilot-release.jks

      - name: Sign production release APK
        if: env.SIGNING_STORE_B64 != '' && env.SIGNING_STORE_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_PASSWORD != ''
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks refinepilot-release.jks \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --out RefinePilot-v0.3-production.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs RefinePilot-v0.3-production.apk
          rm -f refinepilot-release.jks

      - name: Upload production APK
        if: env.SIGNING_STORE_B64 != '' && env.SIGNING_STORE_PASSWORD != '' && env.SIGNING_KEY_ALIAS != '' && env.SIGNING_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: RefinePilot-v0.3-production-apk
          path: RefinePilot-v0.3-production.apk
          if-no-files-found: error
