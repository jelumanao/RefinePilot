name: Build RefinePilot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Android source
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Create release signing certificate
        run: |
          keytool -genkeypair \
            -keystore refinepilot-release.jks \
            -storepass refinepilot2026 \
            -keypass refinepilot2026 \
            -alias refinepilot \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=RefinePilot, OU=Personal Build, O=RefinePilot, L=Tandag, ST=Surigao del Sur, C=PH"

      - name: Sign release APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks refinepilot-release.jks \
            --ks-pass pass:refinepilot2026 \
            --key-pass pass:refinepilot2026 \
            --ks-key-alias refinepilot \
            --out RefinePilot-v0.2-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs RefinePilot-v0.2-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RefinePilot-v0.2-release-apk
          path: RefinePilot-v0.2-release.apk
          if-no-files-found: error
